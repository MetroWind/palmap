<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palmap</title>
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="anonymous">
    <link rel="stylesheet" href="css/palmap.css">
</head>
<body>
    <main class="app-shell">
        <aside id="filter-panel" class="filter-panel">
            <header class="panel-header">
                <div>
                    <h1>Palmap</h1>
                    <p id="status" class="status" aria-live="polite">
                        Loading map data...
                    </p>
                </div>
                <button id="panel-toggle" class="panel-toggle" type="button"
                        aria-controls="filters" aria-expanded="true">
                    Places
                </button>
            </header>
            <section id="filters" class="filters" aria-label="Place types">
            </section>
        </aside>
        <div id="map" class="map" role="application"
             aria-label="Interactive Palworld map. Drag to pan and use the zoom
                         controls to zoom."></div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="anonymous"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
